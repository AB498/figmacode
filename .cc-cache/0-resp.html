<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style id="figma-hosted-fonts">
      @font-face{font-family:"DM Sans";src:url("https://pub-e9f6f8fe38ed4236ada6962783ff638d.r2.dev/fonts/dm-sans/700/normal.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap;}
      @font-face{font-family:"Inter";src:url("https://pub-e9f6f8fe38ed4236ada6962783ff638d.r2.dev/fonts/inter/400/normal.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap;}
      @font-face{font-family:"Inter";src:url("https://pub-e9f6f8fe38ed4236ada6962783ff638d.r2.dev/fonts/inter/500/normal.ttf") format("truetype");font-weight:500;font-style:normal;font-display:swap;}
    </style>
    <title>Section</title>
    <script>
        tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
</head>
<body class="m-0 overflow-auto bg-[#f5f5f5] relative">
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            return (
<div className="w-full bg-[rgba(2,113,232,1)] py-12 px-4 md:px-8">
  <div className="max-w-[1058px] mx-auto flex flex-col items-center text-center gap-8">
    
    <div className="bg-[rgba(228,241,255,1)] rounded-[32px] px-4 py-2">
      <span className="text-[14px] font-[500] leading-[21px] text-[rgba(2,113,232,1)] font-['Inter',sans-serif]">
        Our Tagline
      </span>
    </div>

    <div className="flex flex-col gap-6">
      <h1 className="text-[32px] md:text-[48px] font-[700] leading-[1.2] text-white font-['DM_Sans',sans-serif] tracking-[-0.04em]">
        Rank on Google. Rank on AI. Grow your business.
      </h1>
      <p className="text-[16px] md:text-[18px] font-[400] leading-[27px] text-[rgba(219,234,254,1)] font-['Inter',sans-serif]">
        Search is no longer just Google. People now find businesses through Al Overviews, ChatGPT, Perplexity, and Gemini. 
        <br className="hidden xl:block" />
        Khan IT helps you win on all of them.
      </p>
    </div>

    <div className="flex flex-wrap justify-center gap-3">
      {['Google', 'ChatGPT', 'Perplexity', 'Gemini', 'AI Overviews'].map((item) => (
        <div 
          key={item} 
          className="px-4 py-2 rounded-[100px] bg-[rgba(255,255,255,0.25)] border border-[rgba(255,255,255,0.25)]"
        >
          <span className="text-[14px] font-[400] leading-[20px] text-white font-['Inter',sans-serif]">
            {item}
          </span>
        </div>
      ))}
    </div>

  </div>
</div>
);
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
