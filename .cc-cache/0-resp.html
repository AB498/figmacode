<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style id="figma-hosted-fonts">
      @font-face{font-family:"DM Sans";src:url("https://pub-e9f6f8fe38ed4236ada6962783ff638d.r2.dev/fonts/dm-sans/700/normal.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap;}
      @font-face{font-family:"Inter";src:url("https://pub-e9f6f8fe38ed4236ada6962783ff638d.r2.dev/fonts/inter/400/normal.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap;}
      @font-face{font-family:"Inter";src:url("https://pub-e9f6f8fe38ed4236ada6962783ff638d.r2.dev/fonts/inter/500/normal.ttf") format("truetype");font-weight:500;font-style:normal;font-display:swap;}
    </style>
    <title>Section</title>
    <script>
        tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="m-0 overflow-auto bg-[#f5f5f5]">
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const tags = ["Google", "ChatGPT", "Perplexity", "Gemini", "AI Overviews"];
            return (
                <>
                    <section className="w-full bg-[rgba(2,113,232,1)] px-4 py-12 xl:py-[60px]">
                        <div className="mx-auto flex max-w-[1058px] flex-col items-center gap-8">
                            <div className="flex rounded-[32px] bg-[rgba(228,241,255,1)] px-4 py-2">
                                <span className="font-['Inter',_sans-serif] text-[14px] font-[500] text-[rgba(2,113,232,1)]">Our Tagline</span>
                            </div>
                            
                            <div className="flex flex-col items-center gap-6 text-center">
                                <h1 className="font-['DM_Sans',_sans-serif] text-[32px] font-[700] leading-[1.1] tracking-[0.01em] text-white xl:text-[48px]">
                                    Rank on Google. Rank on AI. Grow your business.
                                </h1>
                                <p className="font-['Inter',_sans-serif] text-[16px] font-[400] leading-[27px] text-[rgba(219,234,254,1)] xl:text-[18px]">
                                    Search is no longer just Google. People now find businesses through Al Overviews, ChatGPT, Perplexity, and Gemini. 
                                    <br className="hidden xl:block" />
                                    Khan IT helps you win on all of them.
                                </p>
                            </div>

                            <div className="flex flex-wrap justify-center gap-3">
                                {tags.map((tag) => (
                                    <div key={tag} className="rounded-[100px] border border-[rgba(255,255,255,0.25)] bg-[rgba(255,255,255,0.25)] px-5 py-2">
                                        <span className="font-['Inter',_sans-serif] text-[14px] font-[400] text-white">{tag}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
